AWSTemplateFormatVersion: '2010-09-09'
Description: Constructora - EC2 demo restringida por IP, Next.js + Go y datos persistentes.
Parameters:
  AllowedClientCidr:
    Type: String
    Description: Tu IPv4 publica seguida de /32. Solo esta IP podra abrir la web.
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$'
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  SourceRef:
    Type: String
    Default: main
    AllowedPattern: '^(main|[a-f0-9]{40})$'
    Description: main o SHA de 40 caracteres ya publicado en GitHub.
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: constructora}]
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Network
      InternetGatewayId: !Ref Gateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Network
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PublicSubnet
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP solo desde IP autorizada; administracion por SSM sin SSH.
      VpcId: !Ref Network
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedClientCidr
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  Server:
    Type: AWS::EC2::Instance
    DependsOn: [DefaultRoute, SubnetRoute]
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags: [{Key: Name, Value: constructora}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/constructora-bootstrap.log) 2>&1
          dnf install -y docker git aws-cfn-bootstrap
          trap '/opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource Server --region ${AWS::Region}' EXIT
          systemctl enable --now docker
          if ! swapon --show | grep -q /swapfile; then
            fallocate -l 4G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          mkdir -p /usr/local/lib/docker/cli-plugins
          COMPOSE_VERSION=v2.40.3
          curl --fail --location --retry 3 "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose
          EXPECTED=$(curl --fail --location --retry 3 "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64.sha256" | awk '{print $1}')
          echo "$EXPECTED  /usr/local/lib/docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          git clone https://github.com/Etson0987Musuline/constructora-.git /opt/constructora
          cd /opt/constructora
          git checkout '${SourceRef}'
          printf 'HTTP_BIND_ADDRESS=0.0.0.0\nHTTP_PORT=80\n' > .env
          docker compose up --detach --build --wait --wait-timeout 300
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://127.0.0.1/api/salud
  PublicAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
  AddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt PublicAddress.AllocationId
      InstanceId: !Ref Server
Outputs:
  WebUrl:
    Description: Web de demostracion (HTTP, acceso limitado a AllowedClientCidr).
    Value: !Sub http://${PublicAddress}
  ApiHealth:
    Value: !Sub http://${PublicAddress}/api/salud
  InstanceId:
    Value: !Ref Server
  SessionManager:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${Server}?region=${AWS::Region}
  Data:
    Value: 'Volumen Docker constructora_records en el EBS raiz retenido. Hacer backup antes de eliminar/reemplazar la instancia.'
